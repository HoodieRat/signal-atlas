name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tracked files for secrets
        run: python scripts/check_secrets.py
      - name: Restore
        run: dotnet restore SignalAtlas.sln
      - name: Build
        run: dotnet build SignalAtlas.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SignalAtlas.sln --configuration Release --no-build
